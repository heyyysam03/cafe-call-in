<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173b2b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Cafe callin"><meta name="description" content="Simple café order calling bell.">
<link rel="manifest" href="./manifest.json"><link rel="apple-touch-icon" href="./icons/icon-192.png"><title>Cafe callin</title>
<style>
:root{color-scheme:light;--green:#173b2b;--green2:#24563e;--cream:#f7f5ed;--ink:#17251d;--muted:#6b756e}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--cream);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;justify-content:center}main{width:min(100%,520px);min-height:100vh;padding:calc(22px + env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column}header{display:flex;align-items:center;gap:12px;margin-bottom:30px}.logo{width:48px;height:48px;border-radius:15px;background:var(--green);display:grid;place-items:center;color:#fff;font-size:25px}h1{font-size:23px;line-height:1.1;margin:0;letter-spacing:-.5px}.sub{color:var(--muted);font-size:13px;margin-top:4px}.panel{background:#fff;border:1px solid #e8e8df;border-radius:22px;padding:20px;box-shadow:0 8px 30px #182b1a0b}.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px}.switch-title{font-weight:650}.switch-desc{color:var(--muted);font-size:12px;margin-top:3px}.switch{position:relative;width:54px;height:31px;flex:none}.switch input{opacity:0;width:0;height:0}.track{position:absolute;inset:0;border-radius:20px;background:#c8cec9;transition:.2s;cursor:pointer}.track:before{content:"";position:absolute;width:23px;height:23px;left:4px;top:4px;border-radius:50%;background:white;transition:.2s;box-shadow:0 1px 4px #0002}.switch input:checked+.track{background:var(--green2)}.switch input:checked+.track:before{transform:translateX(23px)}.number-card{text-align:center;padding:28px 12px 22px;margin:18px 0}.eyebrow{color:var(--muted);font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase}.number{font-size:84px;line-height:1.05;font-weight:800;letter-spacing:-4px;margin:8px 0 4px;color:var(--green);font-variant-numeric:tabular-nums}.number-controls{display:grid;grid-template-columns:62px minmax(0,1fr) 62px;gap:10px;align-items:center;margin:14px auto 4px;max-width:330px}.stepper{height:58px;padding:0;border-radius:15px;background:#edf1eb;color:var(--green);font-size:30px;font-weight:600}.number-input{width:100%;height:58px;border:1px solid #dce2da;border-radius:15px;text-align:center;font-size:27px;font-weight:750;color:var(--green);background:#fff;font-variant-numeric:tabular-nums;outline:none}.number-input:focus{border:2px solid var(--green2)}.hint{color:var(--muted);font-size:13px}button{width:100%;border:0;border-radius:15px;padding:17px 16px;font-size:16px;font-weight:750;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.55;cursor:wait}.primary{background:var(--green);color:white;min-height:62px;font-size:18px;box-shadow:0 5px 0 #0e2a1d}.secondary{background:#edf1eb;color:var(--green)}.outline{background:white;border:1px solid #dce2da;color:var(--green)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.actions button{font-size:14px;padding:14px 10px}.last{margin-top:18px;padding:15px 17px;border-radius:15px;background:#eef1e9;display:flex;justify-content:space-between;align-items:center;gap:10px}.last small{color:var(--muted);display:block;font-size:11px;letter-spacing:.8px;text-transform:uppercase;font-weight:700}.last strong{font-size:19px;color:var(--green)}.status{min-height:24px;text-align:center;color:var(--muted);font-size:12px;margin-top:15px}.tools{display:flex;gap:9px;margin-top:8px}.tools button{font-size:12px;padding:11px 8px;background:transparent;color:var(--muted);border:1px solid #e0e3dc}footer{text-align:center;color:#8a928b;font-size:11px;margin-top:auto;padding-top:25px}@media(max-width:360px){.number{font-size:72px}.panel{padding:16px}}
</style></head><body><main>
<header><div class="logo" aria-hidden="true">☕</div><div><h1>Cafe callin</h1><div class="sub">Simple order calling system</div></div></header>
<section class="panel"><div class="switch-row"><div><div class="switch-title">Ding-Dong bell</div><div class="switch-desc">Play before the spoken announcement</div></div><label class="switch" aria-label="Enable or disable bell sound"><input id="bellToggle" type="checkbox" checked><span class="track"></span></label></div></section>
<section class="panel number-card" aria-live="polite"><div class="eyebrow">Next order</div><div class="number-controls"><button class="stepper" id="minusBtn" aria-label="Decrease order number">−</button><input class="number-input" id="numberInput" type="number" inputmode="numeric" min="1" step="1" value="1" aria-label="Enter next order number"><button class="stepper" id="plusBtn" aria-label="Increase order number">+</button></div><div class="hint">Use + / − or type an order number</div></section>
<button class="primary" id="callBtn">CALL ORDER 1</button>
<div class="last"><div><small>Last called order</small><strong id="lastOrder">—</strong></div><div style="font-size:24px" aria-hidden="true">🔔</div></div>
<div class="actions"><button class="secondary" id="repeatBtn" disabled>Repeat last order</button><button class="outline" id="resetBtn">Reset to 1</button></div>
<div class="tools"><button id="testBell">Test bell</button><button id="testVoice">Test voice</button></div><div class="status" id="status" role="status">Bell is on. Tap Call Order when an order is ready.</div><footer>Keep this app open while calling orders.</footer>
</main><script>
(()=>{const $=id=>document.getElementById(id),bellToggle=$('bellToggle'),numberInput=$('numberInput'),callBtn=$('callBtn'),lastEl=$('lastOrder'),repeatBtn=$('repeatBtn'),statusEl=$('status');let nextOrder=1,lastOrder=null,busy=false,audioContext=null;
try{const saved=JSON.parse(localStorage.getItem('cafe-callin-state')||'{}');if(Number.isSafeInteger(saved.nextOrder)&&saved.nextOrder>0)nextOrder=saved.nextOrder;if(Number.isSafeInteger(saved.lastOrder)&&saved.lastOrder>0)lastOrder=saved.lastOrder;if(typeof saved.bellOn==='boolean')bellToggle.checked=saved.bellOn}catch(_){}
function save(){try{localStorage.setItem('cafe-callin-state',JSON.stringify({nextOrder,lastOrder,bellOn:bellToggle.checked}))}catch(_){}}
function render(){numberInput.value=nextOrder;callBtn.textContent=`CALL ORDER ${nextOrder}`;lastEl.textContent=lastOrder===null?'—':`Order ${lastOrder}`;repeatBtn.disabled=lastOrder===null||busy;callBtn.disabled=busy;$('minusBtn').disabled=busy||nextOrder<=1;$('plusBtn').disabled=busy||nextOrder>=Number.MAX_SAFE_INTEGER;numberInput.disabled=busy;$('testBell').disabled=busy;$('testVoice').disabled=busy}
function setNextOrder(value){const n=Number(value);if(!Number.isSafeInteger(n)||n<1){setStatus('Enter a whole number greater than 0.');render();return}nextOrder=n;save();render();setStatus(`Next order number set to ${n}.`)}
function setStatus(m){statusEl.textContent=m}
function getAudioContext(){const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)throw new Error('Audio is not supported in this browser.');if(!audioContext)audioContext=new Ctx();if(audioContext.state==='suspended')return audioContext.resume().then(()=>audioContext);return Promise.resolve(audioContext)}
async function dingDong(){const ctx=await getAudioContext(),now=ctx.currentTime;const tone=(f,start,duration)=>{const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='sine';osc.frequency.setValueAtTime(f,now+start);gain.gain.setValueAtTime(.0001,now+start);gain.gain.exponentialRampToValueAtTime(.20,now+start+.025);gain.gain.exponentialRampToValueAtTime(.0001,now+start+duration);osc.connect(gain);gain.connect(ctx.destination);osc.start(now+start);osc.stop(now+start+duration+.02)};tone(880,0,.42);tone(659.25,.48,.52);await new Promise(r=>setTimeout(r,1050))}
function speakOrder(n){return new Promise((resolve,reject)=>{if(!('speechSynthesis'in window)||!('SpeechSynthesisUtterance'in window)){reject(new Error('Speech is not supported in this browser.'));return}window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(`Order ${n} is ready.`);u.lang='en-IN';u.rate=.92;u.pitch=1;const voices=window.speechSynthesis.getVoices(),indian=voices.find(v=>/en-IN/i.test(v.lang)),english=voices.find(v=>/^en/i.test(v.lang));if(indian||english)u.voice=indian||english;u.onend=resolve;u.onerror=()=>reject(new Error('Voice announcement could not play. Check phone volume and try Test voice.'));window.speechSynthesis.speak(u)})}
async function announce(n,advance){if(busy)return;busy=true;render();try{if(bellToggle.checked)await dingDong();await new Promise(r=>setTimeout(r,1500));await speakOrder(n);lastOrder=n;if(advance)nextOrder=n+1;save();setStatus(`Order ${n} announced.`)}catch(e){setStatus(e.message||'Could not play announcement.')}finally{busy=false;render()}}
$('minusBtn').addEventListener('click',()=>{if(!busy&&nextOrder>1)setNextOrder(nextOrder-1)});$('plusBtn').addEventListener('click',()=>{if(!busy&&nextOrder<Number.MAX_SAFE_INTEGER)setNextOrder(nextOrder+1)});numberInput.addEventListener('change',()=>setNextOrder(numberInput.value));numberInput.addEventListener('keydown',e=>{if(e.key==='Enter'){numberInput.blur();setNextOrder(numberInput.value)}});callBtn.addEventListener('click',()=>announce(nextOrder,true));repeatBtn.addEventListener('click',()=>{if(lastOrder!==null)announce(lastOrder,false)});$('resetBtn').addEventListener('click',()=>{if(busy)return;nextOrder=1;lastOrder=null;save();render();setStatus('Order numbering reset to 1.')});$('testBell').addEventListener('click',async()=>{if(busy)return;try{busy=true;render();await dingDong();setStatus('Bell test finished.')}catch(e){setStatus(e.message)}finally{busy=false;render()}});$('testVoice').addEventListener('click',async()=>{if(busy)return;try{busy=true;render();await speakOrder(1);setStatus('Voice test finished.')}catch(e){setStatus(e.message)}finally{busy=false;render()}});bellToggle.addEventListener('change',()=>{save();setStatus(bellToggle.checked?'Bell is on.':'Bell is off. Voice announcement will still play.')});if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));render()})();
</script></body></html>
